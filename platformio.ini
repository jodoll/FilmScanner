[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    teemuatlut/TMCStepper@0.7.3
    waspinator/AccelStepper@1.64
build_flags =
    -D VERSION=\"0.1.0\"
    -D PROTOCOL_VERSION=1
    -D LOG_LEVEL=2
    -std=gnu++11
    -fno-exceptions
    -fno-rtti
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++11
    -D UNIT_TEST
    -I lib/scanner_core/include

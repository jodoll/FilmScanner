" id="ent0008" data-source-line="34"><rect x="627.35" y="488.5" width="111.793" height="34" fill="#F7F9FC" style="stroke:#243447;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="637.35" y="509.28" fill="#000" font-size="14" textLength="91.793" font-family="Helvetica">Common GND</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="52"><path d="M6,348.5 L6,410.5 A0,0 0 0 0 6,410.5 L215.57,410.5 A0,0 0 0 0 215.57,410.5 L215.57,383.5 L310.33,379.5 L215.57,375.5 L215.57,358.5 L205.57,348.5 L6,348.5 A0,0 0 0 0 6,348.5" style="stroke:#F9A825;stroke-width:0.5;" fill="#FFFDE7"/><path d="M205.57,348.5 L205.57,358.5 L215.57,358.5 L205.57,348.5" style="stroke:#F9A825;stroke-width:0.5;" fill="#FFFDE7"/><text x="12" y="363.51" fill="#000" font-size="13" textLength="104.749" font-family="Helvetica">+12 V -> TMC VM</text><text x="12" y="376.51" fill="#000" font-size="13" textLength="136.164" font-family="Helvetica">PSU - -> common GND</text><text x="12" y="389.51" fill="#000" font-size="13" textLength="137.63" font-family="Helvetica">Arduino 5V -> TMC VIO</text><text x="12" y="402.51" fill="#000" font-size="13" textLength="188.57" font-family="Helvetica">Never power the motor from 5 V.</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="59"><path d="M550.65,321.5 L550.65,443.5 A0,0 0 0 0 550.65,443.5 L815.832,443.5 A0,0 0 0 0 815.832,443.5 L815.832,331.5 L805.832,321.5 L687.24,321.5 L683.24,276.95 L679.24,321.5 L550.65,321.5 A0,0 0 0 0 550.65,321.5" style="stroke:#F9A825;stroke-width:0.5;" fill="#FFFDE7"/><path d="M805.832,321.5 L805.832,331.5 L815.832,331.5 L805.832,321.5" style="stroke:#F9A825;stroke-width:0.5;" fill="#FFFDE7"/><text x="556.65" y="336.51" fill="#000" font-size="13" textLength="93.228" font-family="Helvetica">Signal mapping:</text><text x="556.65" y="349.51" fill="#000" font-size="13" textLength="196.136" font-family="Helvetica">D9 -> EN, D8 -> DIR, D7 -> STEP</text><text x="556.65" y="362.51" fill="#000" font-size="13" textLength="170.485" font-family="Helvetica">D5 -> 1 kOhm -> PDN_UART</text><text x="556.65" y="375.51" fill="#000" font-size="13" textLength="185.307" font-family="Helvetica">D4 -> PDN_UART (optional RX)</text><line x1="551.65" y1="378.5" x2="814.832" y2="378.5" style="stroke:#F9A825;stroke-width:1;"/><text x="556.65" y="392.51" fill="#000" font-size="13" textLength="216.011" font-family="Helvetica">MS1/MS2 = GND -> UART address 0</text><text x="556.65" y="405.51" fill="#000" font-size="13" textLength="164.004" font-family="Helvetica">CLK = GND -> internal clock</text><text x="556.65" y="418.51" fill="#000" font-size="13" textLength="92.466" font-family="Helvetica">EN is active-low</text><text x="556.65" y="431.51" fill="#000" font-size="13" textLength="244.182" font-family="Helvetica">C1 100 uF VM-GND; C2 100 nF VIO-GND</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="71"><path d="M963.69,448.5 L963.69,501.5 L739.58,505.5 L963.69,509.5 L963.69,562.5 A0,0 0 0 0 963.69,562.5 L1183.391,562.5 A0,0 0 0 0 1183.391,562.5 L1183.391,458.5 L1173.391,448.5 L963.69,448.5 A0,0 0 0 0 963.69,448.5" style="stroke:#F9A825;stroke-width:0.5;" fill="#FFFDE7"/><path d="M1173.391,448.5 L1173.391,458.5 L1183.391,458.5 L1173.391,448.5" style="stroke:#F9A825;stroke-width:0.5;" fill="#FFFDE7"/><text x="969.69" y="463.51" fill="#000" font-size="13" textLength="198.701" font-family="Helvetica">Connect to the common GND bus:</text><text x="969.69" y="476.51" fill="#000" font-size="13" textLength="72.966" font-family="Helvetica">- 12 V PSU -</text><text x="969.69" y="489.51" fill="#000" font-size="13" textLength="85.249" font-family="Helvetica">- Arduino GND</text><text x="969.69" y="502.51" fill="#000" font-size="13" textLength="171.926" font-family="Helvetica">- TMC GND (power and logic)</text><text x="969.69" y="515.51" fill="#000" font-size="13" textLength="132.907" font-family="Helvetica">- TMC MS1, MS2, CLK</text><text x="969.69" y="528.51" fill="#000" font-size="13" textLength="111.973" font-family="Helvetica">- notch switch GND</text><text x="969.69" y="541.51" fill="#000" font-size="13" textLength="111.262" font-family="Helvetica">- control input GND</text><text x="969.69" y="554.51" fill="#000" font-size="13" textLength="161.154" font-family="Helvetica">- optocoupler LED cathodes</text></g><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="82"><path d="M949.59,321.5 L949.59,357.5 A0,0 0 0 0 949.59,357.5 L1197.493,357.5 A0,0 0 0 0 1197.493,357.5 L1197.493,331.5 L1187.493,321.5 L1077.24,321.5 L1073.24,276.73 L1069.24,321.5 L949.59,321.5 A0,0 0 0 0 949.59,321.5" style="stroke:#F9A825;stroke-width:0.5;" fill="#FFFDE7"/><path d="M1187.493,321.5 L1187.493,331.5 L1197.493,331.5 L1187.493,321.5" style="stroke:#F9A825;stroke-width:0.5;" fill="#FFFDE7"/><text x="955.59" y="336.51" fill="#000" font-size="13" textLength="226.903" font-family="Helvetica">Do not connect or disconnect the motor</text><text x="955.59" y="349.51" fill="#000" font-size="13" textLength="122.827" font-family="Helvetica">while VM is powered.</text></g><g class="entity" data-qualified-name="GMN29" id="ent0030" data-source-line="87"><path d="M584.78,54.5 L584.78,90.5 A0,0 0 0 0 584.78,90.5 L679.24,90.5 L683.24,135.13 L687.24,90.5 L781.699,90.5 A0,0 0 0 0 781.699,90.5 L781.699,64.5 L771.699,54.5 L584.78,54.5 A0,0 0 0 0 584.78,54.5" style="stroke:#F9A825;stroke-width:0.5;" fill="#FFFDE7"/><path d="M771.699,54.5 L771.699,64.5 L781.699,64.5 L771.699,54.5" style="stroke:#F9A825;stroke-width:0.5;" fill="#FFFDE7"/><text x="590.78" y="69.51" fill="#000" font-size="13" textLength="153.569" font-family="Helvetica">D13 = onboard status LED</text><text x="590.78" y="82.51" fill="#000" font-size="13" textLength="175.919" font-family="Helvetica">D0/D1 = USB serial (reserved)</text></g><g class="entity" data-qualified-name="GMN32" id="ent0033" data-source-line="92"><path d="M885.83,41 L885.83,90 A0,0 0 0 0 885.83
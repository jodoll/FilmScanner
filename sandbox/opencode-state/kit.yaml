schemaVersion: "3"
kind: mixin
capabilities:
  - type: com.docker.sandbox/volume@1
    config:
      path: /home/agent/.local/share/opencode
      size: 2g
      mode: "0755"
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: chown -R 1000:1000 /home/agent/.local/share/opencode
          user: "0"
        # The base image installs opencode at /home/agent/.opencode/bin, which
        # is not on the PATH sbx searches for the agent binary. Link it to the
        # location sbx expects. No environment variables are touched.
        - command: mkdir -p /usr/local/share/npm-global/bin && ln -sf /home/agent/.opencode/bin/opencode /usr/local/share/npm-global/bin/opencode
          user: "0"
  # Per-sandbox egress. The official kit pre-provisions a broad provider and
  # package-host allowlist; these denies narrow it to this project's needs.
  # The kit's localhost rule for the MCP gateway is left untouched.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - opencode.ai
          - "*.opencode.ai"
          - registry.platformio.org
          - api.registry.platformio.org
          - dl.registry.platformio.org
          - pypi.org
          - files.pythonhosted.org
        deny:
          - github.com
          - "*.github.com"
          - api.github.com
          - codeload.github.com
          - "*.githubusercontent.com"
          - "*.githubcopilot.com"
          - copilot.github.com
          - api.openai.com
          - auth.openai.com
          - chatgpt.com
          - openai.com
          - api.anthropic.com
          - console.anthropic.com
          - claude.ai
          - generativelanguage.googleapis.com
          - aiplatform.googleapis.com
          - oauth2.googleapis.com
          - vertexai.googleapis.com
          - api.x.ai
          - api.groq.com
          - openrouter.ai
          - registry.npmjs.org
          - deb.debian.org
          - dhi.io
      runtime:
        allow:
          - opencode.ai
          - "*.opencode.ai"
          - registry.platformio.org
          - api.registry.platformio.org
          - dl.registry.platformio.org
          - pypi.org
          - files.pythonhosted.org
        deny:
          - github.com
          - "*.github.com"
          - api.github.com
          - codeload.github.com
          - "*.githubusercontent.com"
          - "*.githubcopilot.com"
          - copilot.github.com
          - api.openai.com
          - auth.openai.com
          - chatgpt.com
          - openai.com
          - api.anthropic.com
          - console.anthropic.com
          - claude.ai
          - generativelanguage.googleapis.com
          - aiplatform.googleapis.com
          - oauth2.googleapis.com
          - vertexai.googleapis.com
          - api.x.ai
          - api.groq.com
          - openrouter.ai
          - registry.npmjs.org
          - deb.debian.org
          - dhi.io
